<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge Background -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Car Silhouette Accent on top -->
  <path d="M 16 23 C 18 20, 23 18, 32 18 C 41 18, 46 20, 48 23 L 53 26 C 54.5 27, 55 28.5, 54 30 C 53 31, 51 31, 48 31 L 16 31 C 13 31, 11 31, 10 30 C 9 28.5, 9.5 27, 11 26 Z" fill="none" stroke="url(#blueGlow)" stroke-width="2.2" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Car Windshield/Roof Line -->
  <path d="M 21 24 C 23 20.5, 27 19.5, 32 19.5 C 37 19.5, 41 20.5, 43 24 Z" fill="url(#blueGlow)" opacity="0.35" />

  <!-- LwL Brand Typography -->
  <!-- First 'L' -->
  <text x="14" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="-0.5">L</text>

  <!-- Stylized 'w' in electric cyan -->
  <text x="25" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="22" fill="url(#blueGlow)" filter="url(#glow)">w</text>

  <!-- Second 'L' -->
  <text x="41" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="-0.5">L</text>

  <!-- Bottom Accent Line -->
  <line x1="16" y1="54" x2="48" y2="54" stroke="url(#blueGlow)" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
</svg>